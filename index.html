<style>

.fld{display:grid;gap:7px;margin-bottom:18px}

.opt{display:flex;gap:16px;align-items:center;width:100%;text-align:left;padding:18px 20px;border:1px solid var(--bd);border-radius:5px;margin-bottom:10px;transition:.2s;background:var(--card)}

.emo button span{font-size:2.2rem}.emo button:hover{border-color:var(--bd2);transform:translateY(-3px)}.emo button[aria-pressed=true]{border-color:var(--ac);background:rgba(47,107,255,.14);box-shadow:0 0 36px rgba(47,107,255,.25)}
.big{font-size:clamp(5rem,16vw,13rem);font-weight:700;letter-spacing:-.07em;line-height:.85;font-variant-numeric:tabular-nums}

.ck{padding:0}

<script>

/* ========================= MATCHING ENGINE ========================= */
const has=(st,s)=>st.skills.includes(s)||st.skills.includes(ALIAS[s]);
const credit=(st,s)=>has(st,s)?1:((REL[s]||[]).some(r=>has(st,r))?.8:0);
function calculateOpportunityMatch(st,o){
  const why=[];
  const branchOk=o.branches.includes(A)||o.branches.some(b=>String(st.branch).startsWith(b));
  const yearOk=o.years.includes(+st.year);
  const eligible=branchOk&&yearOk;
  const eligReasons=[];
  if(!branchOk)eligReasons.push(`Open to ${o.branches.join(', ')} students only`);
  if(!yearOk)eligReasons.push(`Open to year ${o.years.join(', ')} only (you are in year ${st.year})`);
  const req=o.skills,matched=[],missing=[];
  let c=0;req.forEach(s=>{const v=credit(st,s);c+=v;(v>=.8?matched:missing).push(s)});
  const bonusMiss=o.bonus.filter(s=>credit(st,s)<.8);
  o.bonus.forEach(s=>{if(credit(st,s)>=.8)matched.push(s)});
  const skillMatch=req.length?Math.round(c/req.length*100):100;
  const hit=o.interests.filter(i=>st.interests.includes(i));
  const interestMatch=Math.round(clamp(hit.length/Math.min(o.interests.length,2),0,1)*100);
  const d=EXP.indexOf(st.experience)-EXP.indexOf(o.exp);
  const experienceMatch=d>=0?100:d===-1?70:40;
  const typePref=st.prefTypes.includes(o.type)?100:60,modePref=o.mode==='On-site'?70:90;
  const preferenceMatch=Math.round(typePref*.6+modePref*.4);
  const score=Math.round(clamp(.4*skillMatch+.2*interestMatch+.2*experienceMatch+.2*preferenceMatch-2*bonusMiss.length));
  const missingSkills=[...missing,...bonusMiss];
  if(branchOk&&yearOk)why.push('Your branch and year satisfy the eligibility rules');
  matched.slice(0,3).forEach(s=>why.push(`${s} ${req.includes(s)?'matches a required skill':'is a useful bonus skill you already have'}`));
  if(hit.length)why.push(`${hit.join(' and ')} ${hit.length>1?'match':'matches'} your interests`);
  if(d>=0)why.push(`Your ${st.experience.toLowerCase()} experience meets the ${o.exp.toLowerCase()} level`);
  return{score:eligible?score:Math.min(score,49),rawScore:score,eligible,eligReasons,eligibility:eligible?100:0,skillMatch,interestMatch,experienceMatch,preferenceMatch,matchedSkills:matched,missingSkills,reasons:why,category:CAT[o.bank]}
}
const ENJ=[null,{l:'Not really',e:'😐',b:-3},{l:'It was okay',e:'🙂',b:-1},{l:'I liked it',e:'😊',b:1.5},{l:'I loved it',e:'🔥',b:3}];
function calculatePostTryoutScore(initial,perf,enjoy){
  const pAdj=Math.round((perf-70)*.15*10)/10, eAdj=enjoy?ENJ[enjoy].b:0;
  return{final:Math.round(clamp(initial+pAdj+eAdj)),pAdj,eAdj}
}

function updateList(){

}

  document.documentElement.dataset.theme=ST.prefs.theme||'dark';
  renderNav(key);$('#app').innerHTML=html+(nofoot?'':footer());window.scrollTo(0,0);post();

function post(){
  requestAnimationFrame(()=>$$('[data-w]').forEach(e=>e.style.width=e.dataset.w+'%'));
  $$('[data-count]').forEach(e=>{const to=+e.dataset.count,from=e.dataset.from!=null?+e.dataset.from:0,suf=e.dataset.suffix||'';if(window.matchMedia('(prefers-reduced-motion:reduce)').matches){e.textContent=to+suf;return}
    const t0=performance.now();(function s(t){const p=Math.min(1,(t-t0)/1100),v=Math.round(from+(to-from)*(1-Math.pow(1-p,3)));e.textContent=(String(e.textContent).startsWith('0')&&to<10?String(v).padStart(2,'0'):v)+suf;if(p<1)requestAnimationFrame(s)})(t0)});
  const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.12});$$('.rv').forEach(e=>io.observe(e));
}

 clearf(){F={q:'',type:'ALL',mode:'',skill:'',branch:'',year:'',dl:'',sort:'match',loc:''};route()},
 pick(el){T.ans[T.i]=+el.dataset.v;paintTry()},
 tnext(){if(T.ans[T.i]!=null){T.i++;paintTry()}},tback(){if(T.i>0){T.i--;paintTry()}},submit(){submitTryout()},
 retry(){T=null},
 enjoy(el){const o=ST.results[location.hash.split('/')[2]],v=+el.dataset.v;if(!o)return;const mm=M(byId(o.id)),before=o.enjoy?o.final:o.initial;window.__from=before;o.enjoy=v;o.final=calculatePostTryoutScore(o.initial,o.perf,v).final;const h=ST.history.filter(x=>x.id===o.id).pop();if(h)h.enjoy=v;save();route();const f=$('#fit');if(f)f.scrollIntoView({behavior:'smooth',block:'center'})},
 obtog(el){const d=OB.d,k=el.dataset.k,v=el.dataset.v,i=d[k].indexOf(v);i<0?d[k].push(v):d[k].splice(i,1);route()},
 obset(el){OB.d[el.dataset.k]=el.dataset.v;route()},
 obback(){OB.step=Math.max(0,OB.step-1);route()},
 obnext(){const d=OB.d,s=OB.step,chk=[()=>d.name.trim()?'':'Enter your name.',()=>'',()=>d.branch?'':'Choose a branch.',()=>d.year?'':'Choose a year.',()=>d.skills.length?'':'Pick at least one skill.',()=>d.interests.length?'':'Pick at least one interest.',()=>d.experience?'':'Choose your level.',()=>d.prefTypes.length?'':'Pick at least one type.'],e=chk[s]();if(e){$('#er').textContent=e;return}OB.step++;route()},
 obfinish(){const d=OB.d;ST.student={...d,name:d.name.trim(),year:+d.year,email:(ST.student&&ST.student.email)||'',levels:{}};ST.results=ST.results||{};save();OB={step:0,d:{name:'',college:'',branch:'',year:'',skills:[],interests:[],experience:'',prefTypes:[]}};location.hash='#/dashboard'},
 ptog(el){const d=PD,k=el.dataset.k,v=el.dataset.v,i=d[k].indexOf(v);i<0?d[k].push(v):d[k].splice(i,1);el.classList.toggle('on');el.setAttribute('aria-pressed',i<0)},
 logout(){ST.student=null;save();location.hash='#/'}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;if(a==='menu'&&el.tagName==='A'){$('#menu').classList.remove('open');return}
  if(a==='retry'){ACT.retry();return}
  if(ACT[a]){if(el.tagName==='BUTTON')e.preventDefault();ACT[a](el)}
});
document.addEventListener('input',e=>{const el=e.target.closest('[data-in]');if(!el)return;const k=el.dataset.k;
  if(el.dataset.in==='f'){F[k]=el.value;if(k==='q'||el.tagName!=='SELECT')updateList()}
  else if(el.dataset.in==='ob'){OB.d[k]=el.value}else if(el.dataset.in==='p'){PD[k]=k==='year'?+el.value:el.value}});
document.addEventListener('change',e=>{const el=e.target.closest('[data-in]');if(!el)return;
  if(el.dataset.in==='f'&&el.tagName==='SELECT')updateList();
  if(el.dataset.in==='track'){setT(+el.dataset.v,el.value);route();toast('Status updated: '+el.value)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#menu').classList.remove('open');if(e.key==='Enter'&&e.target.id==='obin'){e.preventDefault();ACT.obnext()}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target.id,v=i=>($('#'+i)||{}).value||'',er=m=>{$('#er').textContent=m},mail=/^[^@\s]+@[^@\s]+\.[^@\s]+$/;
  if(f==='f-login'){const em=v('em').trim().toLowerCase(),pw=v('pw');if(!mail.test(em))return er('Enter a valid email address.');if(!pw)return er('Enter your password.');
    if(em==='demo@student.com'&&pw==='demo123'){ACT.demo();return}const u=ST.users.find(x=>x.email===em&&x.h===hash(pw));if(!u)return er('Email or password is incorrect. Try the demo login above.');
    if(!ST.student)ST.student={...demoStudent(),name:u.name,email:u.email,skills:[],interests:[],levels:{}};save();location.hash=ST.student.skills.length?'#/dashboard':'#/onboarding'}
  if(f==='f-signup'){const n=v('nm').trim(),em=v('em').trim().toLowerCase(),pw=v('pw');if(!n)return er('Enter your name.');if(!mail.test(em))return er('Enter a valid email address.');if(pw.length<6)return er('Password needs at least 6 characters.');
    if(ST.users.some(x=>x.email===em))return er('That email already has an account. Sign in instead.');ST.users.push({name:n,email:em,h:hash(pw)});OB.d.name=n;OB.step=1;ST.student=null;save();location.hash='#/onboarding'}
  if(f==='f-prof'){if(!PD.name.trim())return er('Name is required.');if(!PD.skills.length)return er('Pick at least one skill.');ST.student={...ST.student,...PD,name:PD.name.trim(),year:+PD.year};save();toast('Profile saved');route()}
  if(f==='f-contact'){if(!v('cn').trim())return er('Enter your name.');if(!mail.test(v('ce').trim()))return er('Enter a valid email address.');if(v('cm').trim().length<5)return er('Write a short message.');
    $('#f-contact').outerHTML=`<div class="empty" role="status"><h2 class="h2">Message<br><span class="ed">sent.</span></h2><p class="mut">Thanks — this prototype stores nothing, but your note would reach us.</p></div>`}
});

const cur=$('#cur');document.addEventListener('mousemove',e=>{cur.style.transform=`translate(${e.clientX}px,${e.clientY}px)`;cur.classList.toggle('h',!!e.target.closest('a,button,select,input,textarea,.opt'))});

load();route();

<script>
/* Particles background (vanilla port of the provided particles-bg component). Background layer only; no other UI is touched. */
function oteParticles(){
  if(window.matchMedia('(prefers-reduced-motion:reduce)').matches||!window.particlesJS)return;
  const html=document.documentElement,isDark=()=>html.dataset.theme!=='light';
  let last=null;
  function init(dark){
    const old=document.querySelector('#particles-js canvas');if(old)old.remove();
    if(window.pJSDom&&window.pJSDom.length){window.pJSDom.forEach(p=>p.pJS.fn.vendors.destroypJS());window.pJSDom=[]}
    const c=dark?{p:'#00f5ff',l:'#00d9ff',a:'#0096c7'}:{p:'#0277bd',l:'#0288d1',a:'#039be5'};
    window.particlesJS('particles-js',{particles:{number:{value:90,density:{enable:true,value_area:900}},color:{value:c.p},shape:{type:'circle',stroke:{width:.5,color:c.a}},
      opacity:{value:.6,random:true,anim:{enable:true,speed:1,opacity_min:.25}},size:{value:3,random:true,anim:{enable:true,speed:2,size_min:1}},
      line_linked:{enable:true,distance:160,color:c.l,opacity:.3,width:1.1},move:{enable:true,speed:1.6,random:true,out_mode:'bounce'}},
      interactivity:{detect_on:'window',events:{onhover:{enable:true,mode:'grab'},onclick:{enable:true,mode:'push'},resize:true},modes:{grab:{distance:200,line_linked:{opacity:.7}},push:{particles_nb:3}}},retina_detect:true});
    last=dark;
  }
  init(isDark());
  new MutationObserver(()=>{if(isDark()!==last)init(isDark())}).observe(html,{attributes:true,attributeFilter:['data-theme']});
}
</script>
